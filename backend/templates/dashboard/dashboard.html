<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add or Select Item</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <h2>Enter New or Select Existing Item</h2>

    <!-- Input field with datalist for suggestions -->
    <form id="itemForm" onsubmit="addItem(event)">
        <div class="mb-3">
            <label for="itemInput" class="form-label">Item Name</label>
            <input list="existingItems" id="itemInput" class="form-control" placeholder="Enter new item or select existing" required>
            <datalist id="existingItems">
                <option value="Sample Item 1"></option>
                <option value="Sample Item 2"></option>
                <option value="Sample Item 3"></option>
            </datalist>
        </div>
        <button type="submit" class="btn btn-primary">Add Item</button>
    </form>

    <hr>

    <!-- List of items added -->
    <h3>Item List</h3>
    <ul id="itemList" class="list-group">
        <!-- Dynamically added items will appear here -->
    </ul>
</div>

<script>
    // JavaScript function to add a new entry
    function addItem(event) {
        event.preventDefault(); // Prevent form submission
        const itemName = document.getElementById('itemInput').value;
        const itemList = document.getElementById('itemList');

        // Add new item to the list
        const newItem = document.createElement('li');
        newItem.className = 'list-group-item';
        newItem.textContent = itemName;
        itemList.appendChild(newItem);

        // Clear the input field
        document.getElementById('itemInput').value = '';
    }
</script>

</body>
</html>
